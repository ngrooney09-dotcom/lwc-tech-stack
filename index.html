<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Favourite Color Picker</title>

  <link rel="stylesheet" href="style.css">
  
</head>

<body class="min-h-screen bg-blue-100 flex items-center justify-center">

  <div class="bg-white rounded-none p-8 w-full max-w-md">
    <h1 class="text-2xl font-bold text-center mb-2">Favourite Color Picker</h1>

    <p class="text-center text-gray-600 mb-6">
      Choose your favourite color
    </p>

    <select id="colorSelect" class="w-full border p-3 rounded-none mb-4">
      <option value="">-- Select a color --</option>
      <option value="red">Red</option>
      <option value="blue">Blue</option>
      <option value="green">Green</option>
      <option value="yellow">Yellow</option>
      <option value="purple">Purple</option>
      <option value="orange">Orange</option>
      <option value="pink">Pink</option>
    </select>

    <button 
      id="showBtn"
      class="w-full bg-blue-500 text-white py-3 rounded-none hover:bg-blue-600"
    >
      Show My Favourite Color
    </button>

    <div id="result" class="mt-6 hidden text-center">
      <p id="resultText" class="mb-3 font-semibold"></p>

      <div id="colorBox" class="w-24 h-24 mx-auto border"></div>
    </div>
  </div>

  <script src="index.js"></script>
</body>
</html>
