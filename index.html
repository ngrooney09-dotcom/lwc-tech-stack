<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Counter App</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="flex items-center justify-center h-screen bg-gray-100">

  <div class="text-center bg-white p-8 rounded-2xl shadow-lg">
    <h1 class="text-2xl font-bold mb-4">Counter</h1>

    <p id="count" class="text-4xl mb-6">0</p>

    <div class="space-x-2">
      <button onclick="decrease()" class="bg-red-500 text-white px-4 py-2 rounded">-</button>
      <button onclick="increase()" class="bg-green-500 text-white px-4 py-2 rounded">+</button>
      <button onclick="reset()" class="bg-gray-700 text-white px-4 py-2 rounded">Reset</button>
    </div>
  </div>

  <script src="bruh.js"></script>
</body>
</html>
